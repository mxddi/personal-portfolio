<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gallery sorter</title>
    <style>
      :root {
        --bg: #09090b;
        --panel: #18181b;
        --line: #27272a;
        --text: #fafafa;
        --muted: #a1a1aa;
        --accent: #2dd4bf;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: grid;
        grid-template-columns: 260px 1fr;
      }
      aside {
        border-right: 1px solid var(--line);
        overflow: auto;
        padding: 20px 12px;
      }
      h1 {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 8px 16px;
        font-weight: 600;
      }
      .loc {
        display: block;
        width: 100%;
        text-align: left;
        background: transparent;
        color: var(--text);
        border: 0;
        border-radius: 6px;
        padding: 10px 12px;
        cursor: pointer;
        font: inherit;
      }
      .loc:hover { background: #27272a; }
      .loc.active { background: #134e4a; color: var(--accent); }
      .count { color: var(--muted); font-size: 12px; }
      main { position: relative; display: flex; flex-direction: column; min-width: 0; }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 24px;
        border-bottom: 1px solid var(--line);
      }
      header h2 { margin: 0; font-size: 18px; font-weight: 560; }
      header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
      .actions { display: flex; gap: 8px; }
      button.save, button.add {
        border: 0;
        border-radius: 6px;
        padding: 10px 16px;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }
      button.save {
        background: var(--accent);
        color: #042f2e;
      }
      button.add {
        background: #27272a;
        color: var(--text);
      }
      button.save:disabled, button.add:disabled { opacity: 0.4; cursor: default; }
      main.file-over .drop-hint { display: flex; }
      .drop-hint {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 5;
        align-items: center;
        justify-content: center;
        background: rgba(9, 9, 11, 0.78);
        color: var(--accent);
        font-weight: 650;
        pointer-events: none;
      }
      .remove {
        position: absolute;
        right: 6px;
        top: 6px;
        z-index: 2;
        width: 24px;
        height: 24px;
        border: 0;
        border-radius: 2px;
        background: rgba(0,0,0,.72);
        color: #f4f4f5;
        font: 600 14px/24px ui-sans-serif, system-ui, sans-serif;
        cursor: pointer;
      }
      .remove:hover { background: #b91c1c; color: #fff; }
      .grid {
        padding: 20px;
        overflow: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 10px;
        align-content: start;
      }
      .card {
        position: relative;
        aspect-ratio: 1;
        overflow: hidden;
        border-radius: 2px;
        background: var(--panel);
        cursor: grab;
      }
      .card.dragging { opacity: 0.4; }
      .card.over { outline: 2px solid var(--accent); }
      .card img, .card video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }
      .badge {
        position: absolute;
        left: 6px;
        top: 6px;
        background: rgba(0,0,0,.72);
        color: #fff;
        font: 600 11px/1 ui-monospace, monospace;
        padding: 4px 6px;
        border-radius: 2px;
      }
      .kind {
        position: absolute;
        right: 6px;
        bottom: 6px;
        background: rgba(0,0,0,.72);
        color: var(--accent);
        font: 600 10px/1 ui-monospace, monospace;
        letter-spacing: 0.08em;
        padding: 4px 6px;
        border-radius: 2px;
      }
      .empty { color: var(--muted); padding: 48px 24px; }
    </style>
  </head>
  <body>
    <aside>
      <h1>Locations</h1>
      <div id="locations"></div>
    </aside>
    <main>
      <header>
        <div>
          <h2 id="title">Gallery sorter</h2>
          <p>Drag files in to add, drag to reorder, X to remove, then save.</p>
        </div>
        <div class="actions">
          <button class="add" id="add" disabled>Add media</button>
          <button class="save" id="save" disabled>Save order</button>
        </div>
      </header>
      <input id="file" type="file" accept="image/*,video/*,.heic,.heif,.mov,.mp4,.m4v,.webm" multiple hidden />
      <div class="drop-hint">Drop to add to this gallery</div>
      <div class="grid" id="grid">
        <p class="empty">Pick a location.</p>
      </div>
    </main>
    <script>
      const locationsEl = document.getElementById("locations");
      const gridEl = document.getElementById("grid");
      const titleEl = document.getElementById("title");
      const saveBtn = document.getElementById("save");
      const addBtn = document.getElementById("add");
      const fileInput = document.getElementById("file");
      const mainEl = document.querySelector("main");

      let current = null;
      let items = [];
      let dirty = false;
      let dragFrom = null;
      let locationName = "Gallery sorter";

      function isVideo(name) {
        return /\.(mp4|mov|webm|m4v)$/i.test(name);
      }

      function uploadName(file) {
        const named = file.name || "";
        if (file.type.startsWith("video/") && !isVideo(named)) {
          const base = named.replace(/\.[^.]+$/, "") || "clip";
          if (file.type.includes("webm")) return `${base}.webm`;
          if (file.type.includes("quicktime")) return `${base}.mov`;
          return `${base}.mp4`;
        }
        return named || (file.type.startsWith("video/") ? "clip.mp4" : "photo.jpg");
      }

      async function loadLocations() {
        const res = await fetch("/api/locations");
        const locs = await res.json();
        locationsEl.innerHTML = "";
        for (const loc of locs) {
          const btn = document.createElement("button");
          btn.className = "loc" + (current === loc.slug ? " active" : "");
          btn.innerHTML = `${loc.location}<div class="count">${loc.count} items</div>`;
          btn.onclick = () => openLocation(loc.slug, loc.location);
          locationsEl.appendChild(btn);
        }
      }

      async function openLocation(slug, location) {
        current = slug;
        locationName = location;
        titleEl.textContent = location;
        dirty = false;
        saveBtn.disabled = true;
        addBtn.disabled = false;
        const res = await fetch(`/api/gallery/${slug}`);
        items = await res.json();
        render();
        loadLocations();
      }

      function render() {
        gridEl.innerHTML = "";
        items.forEach((file, index) => {
          const card = document.createElement("div");
          card.className = "card";
          card.draggable = true;
          card.dataset.index = String(index);
          const media = isVideo(file)
            ? `<video src="/media/${current}/${file}" muted loop autoplay playsinline preload="metadata"></video>`
            : `<img src="/media/${current}/${file}" alt="" />`;
          card.innerHTML = `${media}<span class="badge">${String(index + 1).padStart(2, "0")}</span>${
            isVideo(file) ? `<span class="kind">VID</span>` : ""
          }<button class="remove" type="button" aria-label="Remove">×</button>`;
          card.querySelector(".remove").addEventListener("pointerdown", (e) => {
            e.stopPropagation();
          });
          card.querySelector(".remove").addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (!confirm("Remove this from the gallery?")) return;
            items.splice(index, 1);
            dirty = true;
            saveBtn.disabled = false;
            render();
          });
          card.addEventListener("dragstart", (e) => {
            if (e.target.closest(".remove")) {
              e.preventDefault();
              return;
            }
            dragFrom = index;
            card.classList.add("dragging");
            e.dataTransfer.effectAllowed = "move";
          });
          card.addEventListener("dragend", () => {
            dragFrom = null;
            card.classList.remove("dragging");
            for (const el of gridEl.querySelectorAll(".over")) el.classList.remove("over");
          });
          card.addEventListener("dragover", (e) => {
            if (isFileDrag(e)) {
              e.preventDefault();
              return;
            }
            e.preventDefault();
            card.classList.add("over");
          });
          card.addEventListener("dragleave", () => card.classList.remove("over"));
          card.addEventListener("drop", (e) => {
            if (isFileDrag(e)) {
              e.preventDefault();
              addFiles(e.dataTransfer.files);
              return;
            }
            e.preventDefault();
            card.classList.remove("over");
            if (dragFrom === null || dragFrom === index) return;
            const moved = items.splice(dragFrom, 1)[0];
            items.splice(index, 0, moved);
            dirty = true;
            saveBtn.disabled = false;
            render();
          });
          gridEl.appendChild(card);
        });
      }

      function isFileDrag(e) {
        return e.dataTransfer && [...e.dataTransfer.types].includes("Files");
      }

      async function saveOrder() {
        if (!current || !dirty) return true;
        saveBtn.disabled = true;
        saveBtn.textContent = "Saving…";
        const res = await fetch(`/api/gallery/${current}/reorder`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ order: items }),
        });
        if (!res.ok) {
          const err = await res.text();
          alert(err || "Save failed");
          saveBtn.disabled = false;
          saveBtn.textContent = "Save order";
          return false;
        }
        const saved = await res.json();
        items = saved.files;
        dirty = false;
        saveBtn.textContent = "Saved";
        setTimeout(() => { saveBtn.textContent = "Save order"; }, 1200);
        loadLocations();
        render();
        return true;
      }

      async function addFiles(fileList) {
        if (!current) {
          alert("Pick a location first.");
          return;
        }
        const files = [...fileList].filter(Boolean);
        if (!files.length) return;
        if (dirty && !(await saveOrder())) return;
        addBtn.disabled = true;
        addBtn.textContent = "Adding…";
        const body = new FormData();
        for (const file of files) body.append("files", file, uploadName(file));
        const res = await fetch(`/api/gallery/${current}/add`, {
          method: "POST",
          body,
        });
        if (!res.ok) {
          alert((await res.text()) || "Add failed");
          addBtn.disabled = false;
          addBtn.textContent = "Add media";
          return;
        }
        const saved = await res.json();
        items = saved.files;
        dirty = false;
        saveBtn.disabled = true;
        addBtn.disabled = false;
        addBtn.textContent = "Add media";
        if (saved.skipped && saved.skipped.length) {
          alert("Skipped:\n" + saved.skipped.join("\n"));
        }
        loadLocations();
        render();
      }

      saveBtn.onclick = saveOrder;
      addBtn.onclick = () => fileInput.click();
      fileInput.onchange = () => {
        addFiles(fileInput.files);
        fileInput.value = "";
      };

      mainEl.addEventListener("dragover", (e) => {
        if (!isFileDrag(e) || !current) return;
        e.preventDefault();
        mainEl.classList.add("file-over");
      });
      mainEl.addEventListener("dragleave", (e) => {
        if (e.target === mainEl) mainEl.classList.remove("file-over");
      });
      mainEl.addEventListener("drop", (e) => {
        if (!isFileDrag(e)) return;
        e.preventDefault();
        mainEl.classList.remove("file-over");
        addFiles(e.dataTransfer.files);
      });

      loadLocations();
    </script>
  </body>
</html>
